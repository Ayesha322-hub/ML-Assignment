stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - src/features.py
      - params.yaml
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.csv
      - params.yaml
    outs:
      - models/model.joblib
  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.joblib
      - data/processed/test.csv
      - params.yaml
    metrics:
      - metrics.json:
          cache: false
